schemaVersion: "2.2.0"
metadata:
  name: demo-lightwell
  version: "1.0.0"
  displayName: Lightwell Java Demo
  description: JBoss legacy + Nexus Lightwell + RHDA (TPA/TDA) journey
  tags: ["java", "maven", "jboss", "lightwell", "nexus"]

components:
  - name: tools
    container:
      image: quay.io/devfile/universal-developer-image:ubi9-latest
      memoryLimit: 3Gi
      memoryRequest: 1Gi
      cpuLimit: "2"
      cpuRequest: "200m"
      mountSources: true
      endpoints:
        - name: http-app
          targetPort: 8080
          exposure: public
      env:
        - name: LIGHTWELL_TIER
          value: validated
        # Trust Red Hat Dependency Analytics (Trusted Profile Analyzer client) for auth APIs.
        - name: VSCODE_TRUSTED_EXTENSIONS
          value: "redhat.fabric8-analytics"

commands:
  - id: demo-up
    exec:
      label: "1) demo-up — umbrella (Nexus + PipelineRun + DevSpaces)"
      component: tools
      workingDir: ${PROJECT_SOURCE}
      commandLine: |
        set -euo pipefail
        NS="$(oc project -q)"
        INTERNAL_IMAGE="image-registry.openshift-image-registry.svc:5000/${NS}/demo-lightwell"
        if grep -A3 '^lightwell:' charts/demo-lightwell/values.yaml | grep -q 'CHANGE_ME'; then
          echo "ERROR: edit charts/demo-lightwell/values.yaml (lightwell.username / lightwell.token)" >&2
          exit 1
        fi
        helm dependency update charts/demo-lightwell
        helm upgrade --install demo charts/demo-lightwell \
          --set "jboss-app.image.repository=${INTERNAL_IMAGE}" \
          --set jboss-app.image.tag=latest \
          --set 'jboss-app.image.pullSecrets={}' \
          --wait --timeout 12m \
          || echo "WARN: helm wait timed out; check pods / pipelinerun"
        oc get pods,route,pipelinerun 2>/dev/null || true
        echo "Pipeline builds to: ${INTERNAL_IMAGE}:latest"
        echo "Next: open app/pom.xml → RHDA report → open-jboss-console"
      group:
        kind: build
        isDefault: true

  - id: analyze-cves
    exec:
      label: "2) analyze-cves — prepare RHDA (then open report in IDE)"
      component: tools
      workingDir: ${PROJECT_SOURCE}
      commandLine: |
        bash scripts/rhda-prepare.sh

  - id: open-jboss-console
    exec:
      label: "3) open-jboss-console"
      component: tools
      workingDir: ${PROJECT_SOURCE}
      commandLine: "bash scripts/open-jboss-console.sh"

  - id: demo-status
    exec:
      label: "demo-status"
      component: tools
      workingDir: ${PROJECT_SOURCE}
      commandLine: |
        oc get pods,route,pvc,pipelinerun 2>/dev/null || oc get pods,route,pvc
        helm list 2>/dev/null || true
        DS_NS="$(oc project -q | sed 's/-dev$/-devspaces/')"
        oc get devworkspace -n "${DS_NS}" 2>/dev/null || true

events:
  postStart:
    - demo-status
