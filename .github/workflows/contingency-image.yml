name: Contingency image (Lightwell direct, no Nexus)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate-lightwell-direct:
    name: Maven resolve via Lightwell (no Nexus)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Resolve Lightwell tier
        id: tier
        env:
          LIGHTWELL_TIER: ${{ secrets.LIGHTWELL_TIER }}
        run: |
          TIER="${LIGHTWELL_TIER:-validated}"
          case "$TIER" in
            remediated)
              echo "server_id=lightwell-remediated" >> "$GITHUB_OUTPUT"
              echo "url=https://packages.redhat.com/lightwell/java/remediated/" >> "$GITHUB_OUTPUT"
              ;;
            validated-prod)
              echo "server_id=lightwell-validated" >> "$GITHUB_OUTPUT"
              echo "url=https://packages.redhat.com/lightwell/java/validated/" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "server_id=lightwell-validated" >> "$GITHUB_OUTPUT"
              echo "url=https://packages.redhat.com/api/pulp-content/public-lightwell-demo/java/validated/" >> "$GITHUB_OUTPUT"
              ;;
          esac
          echo "tier=$TIER" >> "$GITHUB_OUTPUT"

      - name: Render Maven settings (secrets)
        env:
          LIGHTWELL_USERNAME: ${{ secrets.LIGHTWELL_USERNAME }}
          LIGHTWELL_TOKEN: ${{ secrets.LIGHTWELL_TOKEN }}
          SERVER_ID: ${{ steps.tier.outputs.server_id }}
          LIGHTWELL_URL: ${{ steps.tier.outputs.url }}
        run: |
          if [ -z "${LIGHTWELL_USERNAME}" ] || [ -z "${LIGHTWELL_TOKEN}" ]; then
            echo "LIGHTWELL_USERNAME / LIGHTWELL_TOKEN secrets are required" >&2
            exit 1
          fi
          python - <<'PY'
          import os
          text = open("app/settings-lightwell-direct.xml.template", encoding="utf-8").read()
          for k, v in {
              "__LIGHTWELL_SERVER_ID__": os.environ["SERVER_ID"],
              "__LIGHTWELL_URL__": os.environ["LIGHTWELL_URL"],
              "__LIGHTWELL_USERNAME__": os.environ["LIGHTWELL_USERNAME"],
              "__LIGHTWELL_PASSWORD__": os.environ["LIGHTWELL_TOKEN"],
          }.items():
              text = text.replace(k, v)
          out = os.environ["RUNNER_TEMP"] + "/settings.xml"
          open(out, "w", encoding="utf-8").write(text)
          print("Using Lightwell URL:", os.environ["LIGHTWELL_URL"])
          PY
      - name: mvn dependency:resolve package
        run: mvn -B -f app/pom.xml -s "$RUNNER_TEMP/settings.xml" dependency:resolve package -DskipTests

      - name: Upload WAR
        uses: actions/upload-artifact@v4
        with:
          name: demo-lightwell-war
          path: app/target/demo-lightwell.war

  build-push-contingency:
    name: Build and push contingency image to Quay
    needs: validate-lightwell-direct
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download WAR
        uses: actions/download-artifact@v4
        with:
          name: demo-lightwell-war
          path: app/target

      - name: Set up QEMU / Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Quay
        uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: Image tags
        id: meta
        env:
          QUAY_IMAGE_SECRET: ${{ secrets.QUAY_IMAGE }}
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          IMAGE="${QUAY_IMAGE_SECRET:-quay.io/maximilianopizarro/demo-lightwell}"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "contingency=${IMAGE}:contingency" >> "$GITHUB_OUTPUT"
          echo "sha=${IMAGE}:sha-${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile.runtime
          push: true
          tags: |
            ${{ steps.meta.outputs.contingency }}
            ${{ steps.meta.outputs.sha }}
