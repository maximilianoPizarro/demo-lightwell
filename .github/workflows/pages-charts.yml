name: Refresh Helm chart packages in docs/charts

# GitHub Pages serves from /docs (legacy). Keep the Helm repo files
# (index.yaml + *.tgz) committed under docs/charts for Artifact Hub.

on:
  push:
    branches: [main]
    paths:
      - "charts/**"
      - ".github/workflows/pages-charts.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.4

      - name: Package charts into docs/charts
        run: |
          mkdir -p docs/charts
          rm -f docs/charts/*.tgz
          helm package charts/nexus -d docs/charts
          helm package charts/jboss-app -d docs/charts
          helm package charts/devspaces-workspace -d docs/charts
          helm repo index docs/charts --url https://maximilianopizarro.github.io/demo-lightwell/charts
          cp docs/artifacthub-repo.yml docs/charts/artifacthub-repo.yml
          ls -la docs/charts
          head -n 5 docs/charts/index.yaml

      - name: Commit updated packages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/charts
          if git diff --staged --quiet; then
            echo "No chart package changes"
          else
            git commit -m "chore: refresh Helm packages in docs/charts for Artifact Hub"
            git push
          fi
