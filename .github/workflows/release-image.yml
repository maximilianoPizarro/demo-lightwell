# Release pipeline (mirrors Tekton lightwell-build-deploy)
# 1) Maven resolve/package via Lightwell validated (direct, no Nexus)
# 2) Build runtime image from WAR
# 3) Push to GHCR by default (always works with GITHUB_TOKEN)
# 4) Optionally push to Quay when secrets are valid (does not fail the release)
name: Release image (Lightwell direct)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      push_quay:
        description: "Also push to Quay (requires QUAY_* secrets with Write)"
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

env:
  LIGHTWELL_DEMO_URL: https://packages.redhat.com/api/pulp-content/public-lightwell-demo/java/validated/

jobs:
  maven-lightwell:
    name: Maven via Lightwell validated
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Resolve Lightwell tier / URL
        id: tier
        env:
          LIGHTWELL_TIER: ${{ secrets.LIGHTWELL_TIER }}
        run: |
          TIER="${LIGHTWELL_TIER:-validated}"
          case "$TIER" in
            remediated)
              echo "server_id=lightwell-remediated" >> "$GITHUB_OUTPUT"
              echo "url=https://packages.redhat.com/lightwell/java/remediated/" >> "$GITHUB_OUTPUT"
              ;;
            validated-prod)
              echo "server_id=lightwell-validated" >> "$GITHUB_OUTPUT"
              echo "url=https://packages.redhat.com/lightwell/java/validated/" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "server_id=lightwell-validated" >> "$GITHUB_OUTPUT"
              echo "url=${LIGHTWELL_DEMO_URL}" >> "$GITHUB_OUTPUT"
              ;;
          esac
          echo "tier=${TIER}" >> "$GITHUB_OUTPUT"

      - name: Render Maven settings (Lightwell docs layout)
        env:
          LIGHTWELL_USERNAME: ${{ secrets.LIGHTWELL_USERNAME }}
          LIGHTWELL_TOKEN: ${{ secrets.LIGHTWELL_TOKEN }}
          SERVER_ID: ${{ steps.tier.outputs.server_id }}
          LIGHTWELL_URL: ${{ steps.tier.outputs.url }}
        run: |
          if [ -z "${LIGHTWELL_USERNAME}" ] || [ -z "${LIGHTWELL_TOKEN}" ]; then
            echo "LIGHTWELL_USERNAME / LIGHTWELL_TOKEN secrets are required" >&2
            exit 1
          fi
          python - <<'PY'
          import os
          text = open("app/settings-lightwell-direct.xml.template", encoding="utf-8").read()
          for k, v in {
              "__LIGHTWELL_SERVER_ID__": os.environ["SERVER_ID"],
              "__LIGHTWELL_URL__": os.environ["LIGHTWELL_URL"],
              "__LIGHTWELL_USERNAME__": os.environ["LIGHTWELL_USERNAME"],
              "__LIGHTWELL_PASSWORD__": os.environ["LIGHTWELL_TOKEN"],
          }.items():
              text = text.replace(k, v)
          out = os.path.join(os.environ["RUNNER_TEMP"], "settings.xml")
          open(out, "w", encoding="utf-8").write(text)
          # Never print secrets; confirm shape
          assert "<servers>" in text and "<id>" + os.environ["SERVER_ID"] + "</id>" in text
          print("Lightwell tier URL:", os.environ["LIGHTWELL_URL"])
          print("Maven server/profile id:", os.environ["SERVER_ID"])
          PY

      - name: mvn dependency:resolve package
        run: |
          mvn -B -f app/pom.xml -s "$RUNNER_TEMP/settings.xml" \
            dependency:resolve package -DskipTests

      - name: Upload WAR
        uses: actions/upload-artifact@v4
        with:
          name: demo-lightwell-war
          path: app/target/demo-lightwell.war
          if-no-files-found: error

  build-push:
    name: Build and push release image
    needs: maven-lightwell
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      ghcr_image: ${{ steps.meta.outputs.ghcr_contingency }}
    steps:
      - uses: actions/checkout@v4

      - name: Download WAR
        uses: actions/download-artifact@v4
        with:
          name: demo-lightwell-war
          path: app/target

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Image tags
        id: meta
        env:
          QUAY_IMAGE_SECRET: ${{ secrets.QUAY_IMAGE }}
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          OWNER_LC="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          REPO_LC="$(echo '${{ github.event.repository.name }}' | tr '[:upper:]' '[:lower:]')"
          GHCR="ghcr.io/${OWNER_LC}/${REPO_LC}"
          QUAY="${QUAY_IMAGE_SECRET:-quay.io/${OWNER_LC}/${REPO_LC}}"
          echo "ghcr=${GHCR}" >> "$GITHUB_OUTPUT"
          echo "ghcr_contingency=${GHCR}:contingency" >> "$GITHUB_OUTPUT"
          echo "ghcr_sha=${GHCR}:sha-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "ghcr_latest=${GHCR}:latest" >> "$GITHUB_OUTPUT"
          echo "quay=${QUAY}" >> "$GITHUB_OUTPUT"
          echo "quay_contingency=${QUAY}:contingency" >> "$GITHUB_OUTPUT"
          echo "quay_sha=${QUAY}:sha-${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push to GHCR (default release)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile.runtime
          push: true
          tags: |
            ${{ steps.meta.outputs.ghcr_contingency }}
            ${{ steps.meta.outputs.ghcr_sha }}
            ${{ steps.meta.outputs.ghcr_latest }}

      # Quay is optional (same idea as tekton quay.push). Only when manually requested:
      # Actions → Release image → Run workflow → push_quay=true
      # Requires Quay robot with Write on the repository (401 = missing Write).
      - name: Login to Quay (optional)
        id: quay_login
        if: github.event_name == 'workflow_dispatch' && inputs.push_quay
        uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: Push to Quay (optional)
        id: quay_push
        if: github.event_name == 'workflow_dispatch' && inputs.push_quay
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile.runtime
          push: true
          tags: |
            ${{ steps.meta.outputs.quay_contingency }}
            ${{ steps.meta.outputs.quay_sha }}

      - name: Release summary
        run: |
          {
            echo "## Release images"
            echo "- **GHCR (default):** \`${{ steps.meta.outputs.ghcr_contingency }}\`"
            if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.push_quay }}" = "true" ]; then
              echo "- **Quay:** \`${{ steps.meta.outputs.quay_contingency }}\`"
            else
              echo "- **Quay:** not requested (workflow_dispatch + push_quay=true)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
