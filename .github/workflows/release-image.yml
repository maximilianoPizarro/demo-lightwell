# Release pipeline (mirrors Tekton lightwell-build-deploy)
# On every push to main: Maven via Lightwell → build image → push Quay + GHCR.
# Requires repo secrets: QUAY_USERNAME, QUAY_PASSWORD (optional QUAY_IMAGE), LIGHTWELL_*.
name: Release image (Lightwell direct)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  LIGHTWELL_DEMO_URL: https://packages.redhat.com/api/pulp-content/public-lightwell-demo/java/validated/
  QUAY_REGISTRY: quay.io
  QUAY_NAMESPACE: maximilianopizarro
  IMAGE_NAME: demo-lightwell

jobs:
  maven-lightwell:
    name: Maven via Lightwell validated
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Resolve Lightwell tier / URL
        id: tier
        env:
          LIGHTWELL_TIER: ${{ secrets.LIGHTWELL_TIER }}
        run: |
          TIER="${LIGHTWELL_TIER:-validated}"
          case "$TIER" in
            remediated)
              echo "server_id=lightwell-remediated" >> "$GITHUB_OUTPUT"
              echo "url=https://packages.redhat.com/lightwell/java/remediated/" >> "$GITHUB_OUTPUT"
              ;;
            validated-prod)
              echo "server_id=lightwell-validated" >> "$GITHUB_OUTPUT"
              echo "url=https://packages.redhat.com/lightwell/java/validated/" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "server_id=lightwell-validated" >> "$GITHUB_OUTPUT"
              echo "url=${LIGHTWELL_DEMO_URL}" >> "$GITHUB_OUTPUT"
              ;;
          esac
          echo "tier=${TIER}" >> "$GITHUB_OUTPUT"

      - name: Render Maven settings (Lightwell docs layout)
        env:
          LIGHTWELL_USERNAME: ${{ secrets.LIGHTWELL_USERNAME }}
          LIGHTWELL_TOKEN: ${{ secrets.LIGHTWELL_TOKEN }}
          SERVER_ID: ${{ steps.tier.outputs.server_id }}
          LIGHTWELL_URL: ${{ steps.tier.outputs.url }}
        run: |
          if [ -z "${LIGHTWELL_USERNAME}" ] || [ -z "${LIGHTWELL_TOKEN}" ]; then
            echo "LIGHTWELL_USERNAME / LIGHTWELL_TOKEN secrets are required" >&2
            exit 1
          fi
          python - <<'PY'
          import os
          text = open("app/settings-lightwell-direct.xml.template", encoding="utf-8").read()
          for k, v in {
              "__LIGHTWELL_SERVER_ID__": os.environ["SERVER_ID"],
              "__LIGHTWELL_URL__": os.environ["LIGHTWELL_URL"],
              "__LIGHTWELL_USERNAME__": os.environ["LIGHTWELL_USERNAME"],
              "__LIGHTWELL_PASSWORD__": os.environ["LIGHTWELL_TOKEN"],
          }.items():
              text = text.replace(k, v)
          out = os.path.join(os.environ["RUNNER_TEMP"], "settings.xml")
          open(out, "w", encoding="utf-8").write(text)
          # Never print secrets; confirm shape
          assert "<servers>" in text and "<id>" + os.environ["SERVER_ID"] + "</id>" in text
          print("Lightwell tier URL:", os.environ["LIGHTWELL_URL"])
          print("Maven server/profile id:", os.environ["SERVER_ID"])
          PY

      - name: mvn dependency:resolve package
        run: |
          mvn -B -f app/pom.xml -s "$RUNNER_TEMP/settings.xml" \
            dependency:resolve package -DskipTests

      - name: Upload WAR
        uses: actions/upload-artifact@v4
        with:
          name: demo-lightwell-war
          path: app/target/demo-lightwell.war
          if-no-files-found: error

  build-push:
    name: Build and push release image
    needs: maven-lightwell
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      ghcr_image: ${{ steps.meta.outputs.ghcr_contingency }}
      quay_image: ${{ steps.meta.outputs.quay_contingency }}
    steps:
      - uses: actions/checkout@v4

      - name: Download WAR
        uses: actions/download-artifact@v4
        with:
          name: demo-lightwell-war
          path: app/target

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Image tags
        id: meta
        env:
          QUAY_IMAGE_SECRET: ${{ secrets.QUAY_IMAGE }}
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          OWNER_LC="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          REPO_LC="$(echo '${{ github.event.repository.name }}' | tr '[:upper:]' '[:lower:]')"
          GHCR="ghcr.io/${OWNER_LC}/${REPO_LC}"
          QUAY="${QUAY_IMAGE_SECRET:-${QUAY_REGISTRY}/${QUAY_NAMESPACE}/${IMAGE_NAME}}"
          QUAY_PATH="${QUAY#*/}"   # namespace/name (strip registry)
          QUAY_NS="${QUAY_PATH%%/*}"
          QUAY_REPO="${QUAY_PATH#*/}"
          {
            echo "ghcr=${GHCR}"
            echo "ghcr_contingency=${GHCR}:contingency"
            echo "ghcr_sha=${GHCR}:sha-${SHORT_SHA}"
            echo "ghcr_latest=${GHCR}:latest"
            echo "quay=${QUAY}"
            echo "quay_ns=${QUAY_NS}"
            echo "quay_repo=${QUAY_REPO}"
            echo "quay_contingency=${QUAY}:contingency"
            echo "quay_sha=${QUAY}:sha-${SHORT_SHA}"
            echo "quay_latest=${QUAY}:latest"
          } >> "$GITHUB_OUTPUT"

      # GHCR first so a Quay permission issue never blocks the public release image.
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push to GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile.runtime
          push: true
          tags: |
            ${{ steps.meta.outputs.ghcr_contingency }}
            ${{ steps.meta.outputs.ghcr_sha }}
            ${{ steps.meta.outputs.ghcr_latest }}

      - name: Login to Quay.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.QUAY_REGISTRY }}
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: Ensure Quay repository exists
        env:
          QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
          QUAY_PASSWORD: ${{ secrets.QUAY_PASSWORD }}
          QUAY_NS: ${{ steps.meta.outputs.quay_ns }}
          QUAY_REPO: ${{ steps.meta.outputs.quay_repo }}
        run: |
          set -euo pipefail
          # Robot token for Quay API (Bearer). Basic auth triggers CSRF on quay.io.
          HDR=(-H "Authorization: Bearer ${QUAY_PASSWORD}" -H "Content-Type: application/json")
          CODE=$(curl -sS -o /tmp/quay-repo.json -w "%{http_code}" \
            "${HDR[@]}" "https://quay.io/api/v1/repository/${QUAY_NS}/${QUAY_REPO}" || true)
          echo "GET repository HTTP ${CODE}"
          if [ "${CODE}" = "200" ]; then
            echo "Quay repository ${QUAY_NS}/${QUAY_REPO} already exists"
          else
            echo "Creating Quay repository ${QUAY_NS}/${QUAY_REPO}..."
            HTTP=$(curl -sS -o /tmp/quay-create.json -w "%{http_code}" \
              "${HDR[@]}" \
              -d "{\"repository\":\"${QUAY_REPO}\",\"visibility\":\"public\",\"description\":\"Lightwell Java demo\",\"namespace\":\"${QUAY_NS}\"}" \
              "https://quay.io/api/v1/repository" || true)
            echo "POST repository HTTP ${HTTP}"
            cat /tmp/quay-create.json || true
            if [ "${HTTP}" != "201" ] && [ "${HTTP}" != "200" ]; then
              echo "Create returned ${HTTP}; continuing (docker push will confirm Write)."
            fi
          fi
          HTTP=$(curl -sS -o /tmp/quay-perm.json -w "%{http_code}" \
            "${HDR[@]}" -X PUT \
            -d '{"role":"write"}' \
            "https://quay.io/api/v1/repository/${QUAY_NS}/${QUAY_REPO}/permissions/user/${QUAY_USERNAME}" || true)
          echo "PUT robot write permission HTTP ${HTTP}"
          cat /tmp/quay-perm.json || true

      - name: Build and push to Quay
        id: quay_push
        continue-on-error: true
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile.runtime
          push: true
          tags: |
            ${{ steps.meta.outputs.quay_latest }}
            ${{ steps.meta.outputs.quay_contingency }}
            ${{ steps.meta.outputs.quay_sha }}

      - name: Release summary
        if: always()
        run: |
          {
            echo "## Release images"
            echo "- **GHCR:** \`${{ steps.meta.outputs.ghcr_contingency }}\`"
            if [ "${{ steps.quay_push.outcome }}" = "success" ]; then
              echo "- **Quay:** \`${{ steps.meta.outputs.quay_contingency }}\` (also \`latest\`, \`sha-…\`)"
            else
              echo "- **Quay:** push did not succeed for \`${{ steps.meta.outputs.quay }}\` — check robot Write on that repository (secrets \`QUAY_USERNAME\` / \`QUAY_PASSWORD\` / \`QUAY_IMAGE\`)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
