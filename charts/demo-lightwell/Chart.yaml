apiVersion: v2
name: demo-lightwell
description: Umbrella chart for the Lightwell Java demo — secrets, Nexus (Lightwell proxy), JBoss/WildFly, Tekton PipelineRun to OpenShift internal registry (optional Quay), and DevWorkspace.
type: application
version: 0.2.2
appVersion: "1.0.0"
home: https://maximilianopizarro.github.io/demo-lightwell/
icon: https://raw.githubusercontent.com/maximilianoPizarro/demo-lightwell/main/docs/brand/lightwell_logo_light.svg
keywords:
  - lightwell
  - nexus
  - jboss
  - wildfly
  - tekton
  - openshift
  - maven
  - supply-chain
sources:
  - https://github.com/maximilianoPizarro/demo-lightwell
maintainers:
  - name: Maximiliano Pizarro
    email: maximiliano.pizarro.5@gmail.com
dependencies:
  - name: nexus
    version: "0.1.1"
    repository: "file://../nexus"
  - name: jboss-app
    version: "0.1.3"
    repository: "file://../jboss-app"
annotations:
  artifacthub.io/license: Apache-2.0
  artifacthub.io/category: security
  artifacthub.io/prerelease: "false"
  artifacthub.io/links: |
    - name: Documentation
      url: https://maximilianopizarro.github.io/demo-lightwell/
    - name: Run the demo
      url: https://maximilianopizarro.github.io/demo-lightwell/#run
    - name: App & console access
      url: https://maximilianopizarro.github.io/demo-lightwell/#access
    - name: Day-2 remediated tier
      url: https://maximilianopizarro.github.io/demo-lightwell/#day2
    - name: Lightwell product
      url: https://www.redhat.com/en/lightwell
    - name: Source
      url: https://github.com/maximilianoPizarro/demo-lightwell
  artifacthub.io/images: |
    - name: nexus
      image: docker.io/sonatype/nexus3:3.70.1
    - name: wildfly-runtime
      image: quay.io/wildfly/wildfly:27.0.1.Final-jdk17
  artifacthub.io/screenshots: |
    - title: Architecture
      url: https://raw.githubusercontent.com/maximilianoPizarro/demo-lightwell/main/docs/lightwell-architecture.png
  artifacthub.io/changes: |
    - kind: fixed
      description: HAL console CORS — jboss-app sets management allowed-origins for OpenShift edge Routes
    - kind: fixed
      description: Artifact Hub images use public Nexus/WildFly bases (app image is internal/GHCR)
    - kind: changed
      description: Auto PipelineRun to OpenShift internal registry; optional Quay push; create DevWorkspace on install
    - kind: added
      description: Umbrella chart — secrets + Nexus + JBoss + Tekton in one install
