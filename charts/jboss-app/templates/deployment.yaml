apiVersion: v1
kind: Service
metadata:
  name: {{ include "jboss-app.fullname" . }}
  labels:
    {{- include "jboss-app.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
    - name: management
      port: {{ .Values.service.managementPort }}
      targetPort: management
  selector:
    app.kubernetes.io/name: {{ include "jboss-app.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "jboss-app.fullname" . }}
  labels:
    {{- include "jboss-app.labels" . | nindent 4 }}
  annotations:
    {{- include "jboss-app.annotations" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "jboss-app.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        {{- include "jboss-app.labels" . | nindent 8 }}
    spec:
      {{- if .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- range .Values.image.pullSecrets }}
        - name: {{ . }}
        {{- end }}
      {{- end }}
      containers:
        - name: jboss
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/bin/bash", "/opt/demo/wildfly-entrypoint.sh"]
          ports:
            - name: http
              containerPort: 8080
            - name: management
              containerPort: 9990
          env:
            - name: ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.admin.existingSecret }}
                  key: username
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.admin.existingSecret }}
                  key: password
            {{- $origins := include "jboss-app.managementAllowedOrigins" . | trim }}
            {{- if $origins }}
            - name: MANAGEMENT_ALLOWED_ORIGINS
              value: {{ $origins | quote }}
            {{- end }}
          volumeMounts:
            - name: wildfly-entrypoint
              mountPath: /opt/demo/wildfly-entrypoint.sh
              subPath: wildfly-entrypoint.sh
              readOnly: true
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          # WildFly may return 403 on / for some welcome configs; TCP is reliable for sandbox demos.
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 40
            periodSeconds: 10
            failureThreshold: 12
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 90
            periodSeconds: 20
            failureThreshold: 6
      volumes:
        - name: wildfly-entrypoint
          configMap:
            name: {{ include "jboss-app.fullname" . }}-entrypoint
            defaultMode: 0755
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "jboss-app.fullname" . }}-entrypoint
  labels:
    {{- include "jboss-app.labels" . | nindent 4 }}
data:
  wildfly-entrypoint.sh: |
{{ .Files.Get "files/wildfly-entrypoint.sh" | indent 4 }}
---
{{- if .Values.route.enabled }}
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: {{ include "jboss-app.fullname" . }}
  labels:
    {{- include "jboss-app.labels" . | nindent 4 }}
spec:
  {{- if .Values.route.host }}
  host: {{ .Values.route.host | quote }}
  {{- end }}
  {{- if .Values.route.path }}
  path: {{ .Values.route.path | quote }}
  {{- end }}
  to:
    kind: Service
    name: {{ include "jboss-app.fullname" . }}
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
{{- end }}
---
{{- if and .Values.route.enabled .Values.route.management.enabled }}
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: {{ include "jboss-app.fullname" . }}-mgmt
  labels:
    {{- include "jboss-app.labels" . | nindent 4 }}
spec:
  {{- if .Values.route.management.host }}
  host: {{ .Values.route.management.host | quote }}
  {{- end }}
  {{- if .Values.route.management.path }}
  path: {{ .Values.route.management.path | quote }}
  {{- end }}
  to:
    kind: Service
    name: {{ include "jboss-app.fullname" . }}
  port:
    targetPort: management
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
{{- end }}
