replicaCount: 1

image:
  # Default for Sandbox: OpenShift internal registry (set NS at install).
  # GHA publishes to Quay (QUAY_IMAGE / demo-ligthwell) and GHCR as public fallback.
  repository: image-registry.openshift-image-registry.svc:5000/REPLACE_NS/demo-lightwell
  tag: latest
  pullPolicy: IfNotPresent
  pullSecrets: []

nameOverride: jboss-app
fullnameOverride: ""

service:
  type: ClusterIP
  port: 8080
  managementPort: 9990

route:
  enabled: true
  host: ""
  # App home (HealthServlet on / and /health)
  path: /
  # OpenShift apps domain (e.g. apps.rm2.thpm.p1.openshiftapps.com). Used to build
  # MANAGEMENT_ALLOWED_ORIGINS when management.host is empty. If blank, Helm tries
  # lookup of config.openshift.io/v1 Ingress/cluster.
  clusterDomain: ""
  management:
    enabled: true
    host: ""
    # Leave empty: HAL needs /console AND /management on the same host
    path: ""
    # Optional override list of HTTPS origins for WildFly http-interface allowed-origins.
    # When empty, derived as https://{management host}.
    allowedOrigins: []

resources:
  requests:
    memory: 256Mi
    cpu: 50m
  limits:
    memory: 768Mi
    cpu: 500m

admin:
  existingSecret: jboss-admin
  # keys: username, password

env: []
