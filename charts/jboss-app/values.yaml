replicaCount: 1

image:
  # Default for Sandbox: OpenShift internal registry (set NS at install).
  # GHA publishes ghcr.io/<owner>/demo-lightwell:contingency as the public release.
  # Quay is optional (requires robot Write).
  repository: image-registry.openshift-image-registry.svc:5000/REPLACE_NS/demo-lightwell
  tag: latest
  pullPolicy: IfNotPresent
  pullSecrets: []

nameOverride: jboss-app
fullnameOverride: ""

service:
  type: ClusterIP
  port: 8080
  managementPort: 9990

route:
  enabled: true
  host: ""
  management:
    enabled: true
    host: ""

resources:
  requests:
    memory: 256Mi
    cpu: 50m
  limits:
    memory: 768Mi
    cpu: 500m

admin:
  existingSecret: jboss-admin
  # keys: username, password

env: []
