{{- if .Values.configureJob.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "nexus.fullname" . }}-configure
  labels:
    {{- include "nexus.labels" . | nindent 4 }}
data:
  configure-lightwell.sh: |
    #!/bin/bash
    set -euo pipefail
    NEXUS_URL="${NEXUS_URL:-http://{{ include "nexus.fullname" . }}:{{ .Values.service.port }}}"
    REPO_NAME="${LIGHTWELL_REPO_NAME}"
    REMOTE_URL="${LIGHTWELL_REMOTE_URL}"
    LW_USER="${LIGHTWELL_USERNAME}"
    LW_PASS="${LIGHTWELL_TOKEN}"
    ADMIN_USER="admin"
    ADMIN_PASS="${NEXUS_ADMIN_PASSWORD}"

    echo "Waiting for Nexus API at ${NEXUS_URL} ..."
    READY=0
    for i in $(seq 1 90); do
      if curl -sf -u "${ADMIN_USER}:${ADMIN_PASS}" \
          -o /dev/null "${NEXUS_URL}/service/rest/v1/repositories"; then
        echo "Nexus admin API is ready (attempt ${i})"
        READY=1
        break
      fi
      sleep 10
    done
    if [ "${READY}" != "1" ]; then
      echo "ERROR: Nexus admin API not ready after waiting" >&2
      exit 1
    fi

    AUTH=(-u "${ADMIN_USER}:${ADMIN_PASS}")

    # Idempotent: change password / accept first-boot if needed
    curl -sf "${AUTH[@]}" -H "Content-Type: text/plain" \
      -X PUT "${NEXUS_URL}/service/rest/v1/security/users/admin/change-password" \
      -d "${ADMIN_PASS}" || true

    EXISTS=$(curl -sf "${AUTH[@]}" "${NEXUS_URL}/service/rest/v1/repositories" \
      | grep -c "\"name\"[[:space:]]*:[[:space:]]*\"${REPO_NAME}\"" || true)
    if [ "${EXISTS}" != "0" ]; then
      echo "Repository ${REPO_NAME} already exists — updating remote URL/auth via delete+recreate"
      curl -sf "${AUTH[@]}" -X DELETE \
        "${NEXUS_URL}/service/rest/v1/repositories/${REPO_NAME}" || true
    fi

    echo "Creating Maven proxy ${REPO_NAME} -> ${REMOTE_URL}"
    HTTP_CODE=$(curl -s -o /tmp/nexus-create.out -w "%{http_code}" "${AUTH[@]}" \
      -H "Content-Type: application/json" \
      -X POST "${NEXUS_URL}/service/rest/v1/repositories/maven/proxy" \
      -d @- <<EOF
    {
      "name": "${REPO_NAME}",
      "online": true,
      "storage": {
        "blobStoreName": "default",
        "strictContentTypeValidation": false
      },
      "proxy": {
        "remoteUrl": "${REMOTE_URL}",
        "contentMaxAge": 1440,
        "metadataMaxAge": 1440
      },
      "negativeCache": {
        "enabled": false,
        "timeToLive": 1
      },
      "httpClient": {
        "blocked": false,
        "autoBlock": true,
        "connection": {
          "enableCircularRedirects": true,
          "enableCookies": true
        },
        "authentication": {
          "type": "username",
          "username": "${LW_USER}",
          "password": "${LW_PASS}",
          "preemptive": false
        }
      },
      "maven": {
        "versionPolicy": "RELEASE",
        "layoutPolicy": "PERMISSIVE"
      }
    }
    EOF
    )
    echo "Create response HTTP ${HTTP_CODE}"
    cat /tmp/nexus-create.out || true
    if [ "${HTTP_CODE}" != "201" ] && [ "${HTTP_CODE}" != "204" ]; then
      # 400 if already exists is acceptable after race
      if curl -sf "${AUTH[@]}" "${NEXUS_URL}/service/rest/v1/repositories" | grep -q "\"${REPO_NAME}\""; then
        echo "Repository ${REPO_NAME} is present"
      else
        echo "ERROR: failed to create repository" >&2
        exit 1
      fi
    fi
    echo "Lightwell proxy configured: ${REPO_NAME} (remote auth = Lightwell service account ${LW_USER})"

    # Ensure maven-public group includes Lightwell so Maven can mirrorOf * via one URL.
    echo "Updating maven-public group to include ${REPO_NAME}"
    curl -sf "${AUTH[@]}" \
      -H "Content-Type: application/json" \
      -X PUT "${NEXUS_URL}/service/rest/v1/repositories/maven/group/maven-public" \
      -d @- <<EOF || true
    {
      "name": "maven-public",
      "online": true,
      "storage": {
        "blobStoreName": "default",
        "strictContentTypeValidation": true
      },
      "group": {
        "memberNames": [
          "maven-releases",
          "maven-snapshots",
          "${REPO_NAME}",
          "maven-central"
        ]
      }
    }
    EOF
    echo "maven-public members:"
    curl -sf "${AUTH[@]}" "${NEXUS_URL}/service/rest/v1/repositories/maven/group/maven-public" \
      | grep -o '"memberNames"[^]]*]' || true
---
# Regular Job (not a Helm hook) so it runs even when --wait blocks on other pods.
# Name includes Release.Revision so upgrades create a fresh Job.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "nexus.fullname" . }}-configure-{{ .Release.Revision }}
  labels:
    {{- include "nexus.labels" . | nindent 4 }}
spec:
  backoffLimit: 8
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        {{- include "nexus.labels" . | nindent 8 }}
        app.kubernetes.io/component: configure
    spec:
      restartPolicy: OnFailure
      containers:
        - name: configure
          image: {{ .Values.configureJob.image | quote }}
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "/scripts/configure-lightwell.sh"]
          env:
            - name: LIGHTWELL_REPO_NAME
              value: {{ .Values.lightwell.repositoryName | quote }}
            - name: LIGHTWELL_REMOTE_URL
              value: {{ .Values.lightwell.remoteUrl | quote }}
            - name: LIGHTWELL_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.lightwell.existingSecret }}
                  key: username
            - name: LIGHTWELL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.lightwell.existingSecret }}
                  key: token
            - name: NEXUS_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "nexus.fullname" . }}-admin
                  key: password
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: scripts
              mountPath: /scripts
      volumes:
        - name: scripts
          configMap:
            name: {{ include "nexus.fullname" . }}-configure
            defaultMode: 0755
{{- end }}
