{{- if .Values.configureJob.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "nexus.fullname" . }}-configure
  labels:
    {{- include "nexus.labels" . | nindent 4 }}
data:
  configure-lightwell.sh: |
    #!/bin/bash
    set -euo pipefail
    NEXUS_URL="${NEXUS_URL:-http://{{ include "nexus.fullname" . }}:{{ .Values.service.port }}}"
    REPO_NAME="${LIGHTWELL_REPO_NAME}"
    REMOTE_URL="${LIGHTWELL_REMOTE_URL}"
    LW_USER="${LIGHTWELL_USERNAME}"
    LW_PASS="${LIGHTWELL_TOKEN}"
    ADMIN_USER="admin"
    ADMIN_PASS="${NEXUS_ADMIN_PASSWORD}"

    echo "Waiting for Nexus at ${NEXUS_URL} ..."
    for i in $(seq 1 60); do
      if curl -sf -o /dev/null "${NEXUS_URL}/service/rest/v1/status"; then
        echo "Nexus is up"
        break
      fi
      # fallback: root path
      if curl -sf -o /dev/null "${NEXUS_URL}/"; then
        echo "Nexus HTTP is up"
        break
      fi
      sleep 10
    done

    # Change default password if still admin123 from first boot file
    if [ -f /nexus-data/admin.password ]; then
      echo "Initial admin.password file present on volume (managed by Deployment mount skip)"
    fi

    AUTH=(-u "${ADMIN_USER}:${ADMIN_PASS}")

    # Try to accept EULA / change password on fresh install
    curl -sf "${AUTH[@]}" -H "Content-Type: text/plain" \
      -X PUT "${NEXUS_URL}/service/rest/v1/security/users/admin/change-password" \
      -d "${ADMIN_PASS}" || true

    EXISTS=$(curl -sf "${AUTH[@]}" "${NEXUS_URL}/service/rest/v1/repositories" | grep -c "\"${REPO_NAME}\"" || true)
    if [ "${EXISTS}" != "0" ]; then
      echo "Repository ${REPO_NAME} already exists"
      exit 0
    fi

    echo "Creating Maven proxy ${REPO_NAME} -> ${REMOTE_URL}"
    curl -sf "${AUTH[@]}" -H "Content-Type: application/json" \
      -X POST "${NEXUS_URL}/service/rest/v1/repositories/maven/proxy" \
      -d @- <<EOF
    {
      "name": "${REPO_NAME}",
      "online": true,
      "storage": {
        "blobStoreName": "default",
        "strictContentTypeValidation": true
      },
      "proxy": {
        "remoteUrl": "${REMOTE_URL}",
        "contentMaxAge": 1440,
        "metadataMaxAge": 1440
      },
      "negativeCache": {
        "enabled": true,
        "timeToLive": 1440
      },
      "httpClient": {
        "blocked": false,
        "autoBlock": true,
        "authentication": {
          "type": "username",
          "username": "${LW_USER}",
          "password": "${LW_PASS}"
        }
      },
      "maven": {
        "versionPolicy": "RELEASE",
        "layoutPolicy": "{{ .Values.lightwell.layoutPolicy }}"
      }
    }
    EOF
    echo "Lightwell proxy configured"
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "nexus.fullname" . }}-configure-{{ .Release.Revision }}
  labels:
    {{- include "nexus.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 6
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: configure
          image: {{ .Values.configureJob.image | quote }}
          command: ["/bin/bash", "/scripts/configure-lightwell.sh"]
          env:
            - name: LIGHTWELL_REPO_NAME
              value: {{ .Values.lightwell.repositoryName | quote }}
            - name: LIGHTWELL_REMOTE_URL
              value: {{ .Values.lightwell.remoteUrl | quote }}
            - name: LIGHTWELL_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.lightwell.existingSecret }}
                  key: username
            - name: LIGHTWELL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.lightwell.existingSecret }}
                  key: token
            - name: NEXUS_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "nexus.fullname" . }}-admin
                  key: password
          volumeMounts:
            - name: scripts
              mountPath: /scripts
      volumes:
        - name: scripts
          configMap:
            name: {{ include "nexus.fullname" . }}-configure
            defaultMode: 0755
{{- end }}
