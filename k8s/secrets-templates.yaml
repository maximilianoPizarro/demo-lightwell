apiVersion: v1
kind: Secret
metadata:
  name: lightwell-sa
  labels:
    app.kubernetes.io/part-of: demo-lightwell
type: Opaque
stringData:
  username: "REPLACE_ME"
  token: "REPLACE_ME"
---
# DevSpaces: mount Lightwell + Nexus URL as env into every workspace
apiVersion: v1
kind: Secret
metadata:
  name: lightwell-devspaces-env
  labels:
    controller.devfile.io/mount-to-devworkspace: "true"
    controller.devfile.io/watch-secret: "true"
    app.kubernetes.io/part-of: demo-lightwell
  annotations:
    controller.devfile.io/mount-as: env
type: Opaque
stringData:
  LIGHTWELL_USERNAME: "REPLACE_ME"
  LIGHTWELL_TOKEN: "REPLACE_ME"
  LIGHTWELL_TIER: "validated"
  LIGHTWELL_URL: "https://packages.redhat.com/api/pulp-content/public-lightwell-demo/java/validated/"
  NEXUS_URL: "https://REPLACE_NEXUS_HOST"
  QUAY_IMAGE: "quay.io/maximilianopizarro/demo-lightwell"
---
apiVersion: v1
kind: Secret
metadata:
  name: jboss-admin
  labels:
    app.kubernetes.io/part-of: demo-lightwell
type: Opaque
stringData:
  username: admin
  password: "Admin#123"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: maven-settings-nexus
  labels:
    controller.devfile.io/mount-to-devworkspace: "true"
    controller.devfile.io/watch-configmap: "true"
    app.kubernetes.io/part-of: demo-lightwell
  annotations:
    controller.devfile.io/mount-as: subpath
    controller.devfile.io/mount-path: /home/user/.m2
data:
  settings.xml: |
    <settings xmlns="http://maven.apache.org/SETTINGS/1.2.0"
              xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
              xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.2.0 https://maven.apache.org/xsd/settings-1.2.0.xsd">
      <mirrors>
        <mirror>
          <id>nexus-lightwell</id>
          <name>Nexus Lightwell proxy</name>
          <url>http://nexus:8081/repository/maven-lightwell-validated/</url>
          <mirrorOf>lightwell-validated,lightwell-remediated</mirrorOf>
        </mirror>
      </mirrors>
      <profiles>
        <profile>
          <id>nexus</id>
          <repositories>
            <repository>
              <id>lightwell-validated</id>
              <url>http://nexus:8081/repository/maven-lightwell-validated/</url>
              <releases><enabled>true</enabled></releases>
              <snapshots><enabled>false</enabled></snapshots>
            </repository>
            <repository>
              <id>central</id>
              <url>http://nexus:8081/repository/maven-public/</url>
              <releases><enabled>true</enabled></releases>
              <snapshots><enabled>false</enabled></snapshots>
            </repository>
          </repositories>
        </profile>
      </profiles>
      <activeProfiles>
        <activeProfile>nexus</activeProfile>
      </activeProfiles>
    </settings>
