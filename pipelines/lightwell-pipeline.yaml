apiVersion: v1
kind: ServiceAccount
metadata:
  name: lightwell-pipeline
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: lightwell-pipeline
rules:
  - apiGroups: ["", "apps", "route.openshift.io"]
    resources: ["pods", "services", "deployments", "secrets", "configmaps", "routes", "persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods/log", "pods/exec"]
    verbs: ["get", "list", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: lightwell-pipeline
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: lightwell-pipeline
subjects:
  - kind: ServiceAccount
    name: lightwell-pipeline
---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: maven-lightwell
spec:
  params:
    - name: GOALS
      type: string
      default: "package -DskipTests"
  workspaces:
    - name: source
  steps:
    - name: maven
      image: registry.access.redhat.com/ubi9/openjdk-17:1.21
      workingDir: $(workspaces.source.path)/app
      script: |
        #!/bin/bash
        set -euo pipefail
        cat > /tmp/settings.xml <<'EOF'
        <settings>
          <profiles>
            <profile>
              <id>nexus</id>
              <repositories>
                <repository>
                  <id>lightwell-validated</id>
                  <url>http://nexus:8081/repository/maven-lightwell-validated/</url>
                </repository>
                <repository>
                  <id>central</id>
                  <url>https://repo.maven.apache.org/maven2</url>
                </repository>
              </repositories>
            </profile>
          </profiles>
          <activeProfiles><activeProfile>nexus</activeProfile></activeProfiles>
        </settings>
        EOF
        mvn -B -s /tmp/settings.xml $(params.GOALS)
---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: buildah-push-quay
spec:
  params:
    - name: IMAGE
      type: string
    - name: TAG
      type: string
      default: latest
  workspaces:
    - name: source
  steps:
    - name: build-and-push
      image: registry.access.redhat.com/ubi9/buildah:latest
      securityContext:
        privileged: true
      workingDir: $(workspaces.source.path)
      env:
        - name: QUAY_USERNAME
          valueFrom:
            secretKeyRef:
              name: quay-creds
              key: username
        - name: QUAY_PASSWORD
          valueFrom:
            secretKeyRef:
              name: quay-creds
              key: password
      script: |
        #!/bin/bash
        set -euo pipefail
        IMAGE="$(params.IMAGE):$(params.TAG)"
        buildah login -u "${QUAY_USERNAME}" -p "${QUAY_PASSWORD}" quay.io
        buildah bud -f Containerfile.runtime -t "${IMAGE}" .
        buildah push "${IMAGE}"
---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: helm-deploy-jboss
spec:
  params:
    - name: IMAGE_TAG
      type: string
      default: latest
  workspaces:
    - name: source
  steps:
    - name: deploy
      image: docker.io/alpine/helm:3.14.0
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        set -eu
        helm upgrade --install jboss-app ./charts/jboss-app \
          --set image.tag=$(params.IMAGE_TAG) \
          --wait --timeout 8m
---
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: lightwell-build-deploy
spec:
  params:
    - name: IMAGE
      type: string
      default: quay.io/maximilianopizarro/demo-lightwell
    - name: IMAGE_TAG
      type: string
      default: latest
  workspaces:
    - name: source
  tasks:
    - name: maven
      taskRef:
        name: maven-lightwell
      workspaces:
        - name: source
          workspace: source
    - name: build-push
      runAfter: [maven]
      taskRef:
        name: buildah-push-quay
      params:
        - name: IMAGE
          value: $(params.IMAGE)
        - name: TAG
          value: $(params.IMAGE_TAG)
      workspaces:
        - name: source
          workspace: source
    - name: deploy
      runAfter: [build-push]
      taskRef:
        name: helm-deploy-jboss
      params:
        - name: IMAGE_TAG
          value: $(params.IMAGE_TAG)
      workspaces:
        - name: source
          workspace: source
